apiVersion: v1
kind: ServiceAccount
metadata:
  name: crypto-app
  namespace: crypto-system
  labels:
    app: crypto-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crypto-app-role
  namespace: crypto-system
  labels:
    app: crypto-app
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crypto-app-rolebinding
  namespace: crypto-system
  labels:
    app: crypto-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: crypto-app-role
subjects:
- kind: ServiceAccount
  name: crypto-app
  namespace: crypto-system
