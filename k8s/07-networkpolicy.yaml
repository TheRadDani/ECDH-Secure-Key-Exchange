apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crypto-app-network-policy
  namespace: crypto-system
  labels:
    app: crypto-app
spec:
  podSelector:
    matchLabels:
      app: crypto-app
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: crypto-app
    ports:
    - protocol: TCP
      port: 8080
  - from:
    - namespaceSelector:
        matchLabels:
          name: default
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: crypto-app
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
