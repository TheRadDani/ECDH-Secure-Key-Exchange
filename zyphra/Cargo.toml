[package]
name = "kademlia-crypto-node"
version = "0.2.0"
edition = "2021"
description = "Production-grade P2P cryptocurrency transfer protocol"

[dependencies]
# ── Networking: libp2p production stack ──────────────────────────────
libp2p = { version = "0.54", features = [
    "kad",              # Kademlia DHT for peer routing & discovery
    "tcp",              # TCP transport
    "dns",              # DNS resolution for multiaddrs (internet-scale)
    "noise",            # Noise protocol (authenticated encryption, PFS)
    "yamux",            # Stream multiplexing
    "identify",         # Peer identification & capability exchange
    "gossipsub",        # Pub/sub message broadcasting for tx propagation
    "mdns",             # mDNS local peer discovery (LAN fallback)
    "request-response", # Req/Resp protocol for direct transfers
    "cbor",             # CBOR codec for request-response
    "macros",           # Derive macros for NetworkBehaviour
    "tokio",            # Tokio async runtime integration
] }

# ── Async runtime ───────────────────────────────────────────────────
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# ── Cryptography (audited, production-grade) ────────────────────────
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
sha2 = "0.10"                                                        # SHA-256 for AddressID derivation
sha3 = "0.10"                                                        # Keccak256 for tx hashing
rand = "0.8"                                                         # Secure RNG
x25519-dalek = "2"                                                   # X25519 key exchange (available if needed)
libp2p-identity = "0.2"

# ── Serialization ───────────────────────────────────────────────────
rlp = "0.5"                                        # RLP encoding (Ethereum standard for tx)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"                                 # JSON for CLI/debug/config

# ── Utilities ───────────────────────────────────────────────────────
hex = "0.4"
anyhow = "1.0"
thiserror = "1.0"                                                          # Typed errors for protocol layer
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
dashmap = "6"
clap = { version = "4", features = ["derive"] }                            # CLI argument parsing

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
