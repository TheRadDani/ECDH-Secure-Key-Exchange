[package]
name = "kademlia-crypto-node"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core libp2p dependencies for P2P networking
libp2p = { version = "0.54", features = [
    "kad",           # Kademlia DHT
    "tcp",           # TCP transport
    "noise",         # Noise protocol encryption
    "yamux",         # Multiplexing
    "identify",      # Peer identification
    "gossipsub",     # Optional: for future message broadcasting
    "mdns",          # Optional: local peer discovery
] }

# Async runtime
tokio = { version = "1.41", features = ["full"] }

# Cryptography
sha3 = "0.10"              # SHA-3 (Keccak256) hashing
libp2p-identity = "0.2"    # Identity management

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
hex = "0.4"                # Hex encoding/decoding
anyhow = "1.0"             # Error handling